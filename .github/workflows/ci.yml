name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Application
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Application/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Recuento, perfiles, API y pipeline de vídeo con un modelo simulado: no hace falta PyTorch ni una GPU
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Errores de sintaxis en cualquier módulo del backend, incluidos los que las pruebas no importan
      - run: python -m compileall -q Inference
      # Las versiones de requirements.txt, salvo PyTorch y Ultralytics; OpenCV sin interfaz gráfica
      - run: >
          pip install
          $(grep -E '^(fastapi|uvicorn|numpy|pydantic)==' Inference/requirements.txt)
          opencv-python-headless==$(grep -oP '^opencv-python==\K.*' Inference/requirements.txt)
          httpx
      - run: python -m unittest discover -s Inference/tests -v

  # Publica el panel en GitHub Pages con cada push a main que pasa las comprobaciones (sustituye a npm run
  # deploy). En el repositorio, Settings → Pages → Source tiene que ser «GitHub Actions».
  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: Application
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Application/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: Application/dist
      - id: deployment
        uses: actions/deploy-pages@v4
